<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200">
  <defs>
    <!-- Studio Cyclorama Background -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ececee"/>
      <stop offset="68%" stop-color="#e5e6e8"/>
      <stop offset="74%" stop-color="#dcdde0"/>
      <stop offset="100%" stop-color="#eaebed"/>
    </linearGradient>

    <!-- 3D Cylindrical Matte Shader -->
    <linearGradient id="cylBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#633ba8"/>
      <stop offset="14%" stop-color="#8e62d9"/>
      <stop offset="32%" stop-color="#ad85f0"/>
      <stop offset="52%" stop-color="#8e62d9"/>
      <stop offset="84%" stop-color="#633ba8"/>
      <stop offset="96%" stop-color="#8e62d9"/>
      <stop offset="100%" stop-color="#633ba8"/>
    </linearGradient>

    <!-- 3D Cap Shader -->
    <linearGradient id="cylCap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#141619"/>
      <stop offset="28%" stop-color="#fe5100"/>
      <stop offset="65%" stop-color="#1a1c20"/>
      <stop offset="100%" stop-color="#0d0e10"/>
    </linearGradient>

    <linearGradient id="sameCap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#633ba8"/>
      <stop offset="30%" stop-color="#ad85f0"/>
      <stop offset="75%" stop-color="#633ba8"/>
      <stop offset="100%" stop-color="#633ba8"/>
    </linearGradient>

    <!-- Soft Floor Contact Shadow -->
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.34)"/>
      <stop offset="45%" stop-color="rgba(0,0,0,0.14)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>

    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="glossBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Studio Backdrop -->
  <rect width="900" height="1200" fill="url(#bgGrad)"/>  <!-- Background Cream/Gel Texture Swatch -->
  <g transform="translate(80, 120)">
    <path d="M140,420 C60,340 90,190 220,150 C350,110 540,90 620,210 C700,330 640,560 490,640 C340,720 220,500 140,420 Z" fill="#fe5100" opacity="0.22" filter="url(#softBlur)"/>
    <path d="M170,390 C110,310 150,200 270,170 C390,140 530,150 580,250 C630,350 570,520 440,580 C310,640 230,470 170,390 Z" fill="#fe5100" opacity="0.88"/>
    <path d="M220,330 C260,260 390,230 480,290 C540,330 510,430 420,470" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" opacity="0.45" filter="url(#glossBlur)"/>
    <circle cx="580" cy="640" r="38" fill="#fe5100"/>
    <circle cx="580" cy="640" r="11" fill="#ffcd01"/>
  </g>  <ellipse cx="450" cy="1005" rx="195" ry="34" fill="url(#floorShadow)"/><g transform="translate(450, 580) rotate(-9) translate(-450, -580)">    <!-- Pump / Actuator Nozzle -->
    <rect x="370" y="235" width="115" height="22" rx="6" fill="url(#sameCap)"/>
    <rect x="405" y="235" width="90" height="78" rx="10" fill="url(#sameCap)"/>
    <!-- Neck Collar -->
    <rect x="378" y="308" width="144" height="128" rx="8" fill="url(#sameCap)"/>
    <rect x="392" y="434" width="116" height="14" fill="#633ba8"/>
    <!-- Cylinder Main Body -->
    <rect x="315" y="446" width="270" height="555" rx="28" fill="url(#cylBody)"/>
    <!-- Specular Vertical Highlight -->
    <rect x="352" y="470" width="26" height="505" rx="13" fill="#ffffff" opacity="0.22" filter="url(#glossBlur)"/>
    <!-- Typography & Crest -->
    <text x="450" y="585" text-anchor="middle" font-family="Archivo, Helvetica, sans-serif" font-size="48" font-weight="700" letter-spacing="2.5" fill="#ffffff">SUPPLE</text>
    <circle cx="526" cy="735" r="20" fill="#fe5100"/>
    <circle cx="526" cy="735" r="6" fill="#ffcd01"/>
    <text x="450" y="805" text-anchor="middle" font-family="Archivo, Helvetica, sans-serif" font-size="35" font-weight="700" letter-spacing="1.2" fill="#ffffff">NECTAR</text>
    <text x="450" y="846" text-anchor="middle" font-family="Archivo, Helvetica, sans-serif" font-size="35" font-weight="700" letter-spacing="1.2" fill="#ffffff">GLAZE</text>
    <text x="450" y="895" text-anchor="middle" font-family="Archivo, Helvetica, sans-serif" font-size="21" font-weight="500" fill="#ffffff" opacity="0.88">Barrier Oil</text>
    <text x="450" y="935" text-anchor="middle" font-family="Archivo, Helvetica, sans-serif" font-size="15" font-weight="500" fill="#ffffff" opacity="0.65">30 ML / 1.0 FL OZ</text>  </g>
</svg>
