<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200">
  <defs>
    <!-- Studio Cyclorama Background -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ececee"/>
      <stop offset="68%" stop-color="#e5e6e8"/>
      <stop offset="74%" stop-color="#dcdde0"/>
      <stop offset="100%" stop-color="#eaebed"/>
    </linearGradient>

    <!-- 3D Cylindrical Matte Shader -->
    <linearGradient id="cylBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d9ab00"/>
      <stop offset="14%" stop-color="#ffcd01"/>
      <stop offset="32%" stop-color="#ffde4d"/>
      <stop offset="52%" stop-color="#ffcd01"/>
      <stop offset="84%" stop-color="#d9ab00"/>
      <stop offset="96%" stop-color="#ffcd01"/>
      <stop offset="100%" stop-color="#d9ab00"/>
    </linearGradient>

    <!-- 3D Cap Shader -->
    <linearGradient id="cylCap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#141619"/>
      <stop offset="28%" stop-color="#ffcd01"/>
      <stop offset="65%" stop-color="#1a1c20"/>
      <stop offset="100%" stop-color="#0d0e10"/>
    </linearGradient>

    <linearGradient id="sameCap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d9ab00"/>
      <stop offset="30%" stop-color="#ffde4d"/>
      <stop offset="75%" stop-color="#d9ab00"/>
      <stop offset="100%" stop-color="#d9ab00"/>
    </linearGradient>

    <!-- Soft Floor Contact Shadow -->
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.34)"/>
      <stop offset="45%" stop-color="rgba(0,0,0,0.14)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>

    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="glossBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Studio Backdrop -->
  <rect width="900" height="1200" fill="url(#bgGrad)"/>  <ellipse cx="450" cy="1005" rx="195" ry="34" fill="url(#floorShadow)"/><g >    <!-- Jar Lid -->
    <rect x="260" y="450" width="380" height="115" rx="22" fill="url(#sameCap)"/>
    <rect x="285" y="555" width="330" height="18" fill="#d9ab00"/>
    <!-- Jar Body -->
    <rect x="250" y="568" width="400" height="430" rx="42" fill="url(#cylBody)"/>
    <!-- Rim Highlight -->
    <rect x="295" y="585" width="32" height="390" rx="16" fill="#ffffff" opacity="0.22" filter="url(#glossBlur)"/>
    <!-- Typography & Crest -->
    <text x="450" y="695" text-anchor="middle" font-family="Archivo, Helvetica, sans-serif" font-size="52" font-weight="700" letter-spacing="3" fill="#000000">SUPPLE</text>
    <circle cx="555" cy="765" r="22" fill="#4190de"/>
    <circle cx="555" cy="765" r="6.5" fill="#fe5100"/>
    <text x="450" y="835" text-anchor="middle" font-family="Archivo, Helvetica, sans-serif" font-size="36" font-weight="700" letter-spacing="1.5" fill="#000000">WHIPPED</text>
    <text x="450" y="878" text-anchor="middle" font-family="Archivo, Helvetica, sans-serif" font-size="36" font-weight="700" letter-spacing="1.5" fill="#000000">CERAMIDE</text>
    <text x="450" y="925" text-anchor="middle" font-family="Archivo, Helvetica, sans-serif" font-size="22" font-weight="500" fill="#000000" opacity="0.82">Barrier Cream</text>
    <text x="450" y="960" text-anchor="middle" font-family="Archivo, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#000000" opacity="0.6">60 ML / 2.0 FL OZ</text>  </g>
</svg>
