<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200">
  <defs>
    <!-- Studio Cyclorama Background -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ececee"/>
      <stop offset="68%" stop-color="#e5e6e8"/>
      <stop offset="74%" stop-color="#dcdde0"/>
      <stop offset="100%" stop-color="#eaebed"/>
    </linearGradient>

    <!-- 3D Cylindrical Matte Shader -->
    <linearGradient id="cylBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#583799"/>
      <stop offset="14%" stop-color="#7c55c6"/>
      <stop offset="32%" stop-color="#9b76e0"/>
      <stop offset="52%" stop-color="#7c55c6"/>
      <stop offset="84%" stop-color="#583799"/>
      <stop offset="96%" stop-color="#7c55c6"/>
      <stop offset="100%" stop-color="#583799"/>
    </linearGradient>

    <!-- 3D Cap Shader -->
    <linearGradient id="cylCap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#141619"/>
      <stop offset="28%" stop-color="#7c55c6"/>
      <stop offset="65%" stop-color="#1a1c20"/>
      <stop offset="100%" stop-color="#0d0e10"/>
    </linearGradient>

    <linearGradient id="sameCap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#583799"/>
      <stop offset="30%" stop-color="#9b76e0"/>
      <stop offset="75%" stop-color="#583799"/>
      <stop offset="100%" stop-color="#583799"/>
    </linearGradient>

    <!-- Soft Floor Contact Shadow -->
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.34)"/>
      <stop offset="45%" stop-color="rgba(0,0,0,0.14)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>

    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="glossBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Studio Backdrop -->
  <rect width="900" height="1200" fill="url(#bgGrad)"/>  <!-- Background Cream/Gel Texture Swatch -->
  <g transform="translate(80, 120)">
    <path d="M140,420 C60,340 90,190 220,150 C350,110 540,90 620,210 C700,330 640,560 490,640 C340,720 220,500 140,420 Z" fill="#7c55c6" opacity="0.22" filter="url(#softBlur)"/>
    <path d="M170,390 C110,310 150,200 270,170 C390,140 530,150 580,250 C630,350 570,520 440,580 C310,640 230,470 170,390 Z" fill="#7c55c6" opacity="0.88"/>
    <path d="M220,330 C260,260 390,230 480,290 C540,330 510,430 420,470" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" opacity="0.45" filter="url(#glossBlur)"/>
    <circle cx="580" cy="640" r="38" fill="#4190de"/>
    <circle cx="580" cy="640" r="11" fill="#ffcd01"/>
  </g>  <ellipse cx="450" cy="1005" rx="195" ry="34" fill="url(#floorShadow)"/><g transform="translate(450, 580) rotate(-9) translate(-450, -580)">    <!-- Tube Crimp Top -->
    <rect x="285" y="250" width="330" height="28" rx="4" fill="#583799"/>
    <!-- Tube Tapered Body -->
    <path d="M285,275 L615,275 L565,865 C563,880 550,890 535,890 L365,890 C350,890 337,880 335,865 Z" fill="url(#cylBody)"/>
    <!-- Tube Flip Cap -->
    <rect x="370" y="888" width="160" height="110" rx="14" fill="url(#sameCap)"/>
    <!-- Specular Highlight -->
    <path d="M335,300 L365,850" stroke="#ffffff" stroke-width="22" stroke-linecap="round" opacity="0.18" filter="url(#glossBlur)"/>
    <!-- Typography & Crest -->
    <text x="450" y="450" text-anchor="middle" font-family="Archivo, Helvetica, sans-serif" font-size="50" font-weight="700" letter-spacing="3" fill="#ffffff">SUPPLE</text>
    <circle cx="535" cy="565" r="21" fill="#4190de"/>
    <circle cx="535" cy="565" r="6" fill="#ffcd01"/>
    <text x="450" y="640" text-anchor="middle" font-family="Archivo, Helvetica, sans-serif" font-size="36" font-weight="700" letter-spacing="1.5" fill="#ffffff">FLASH</text>
    <text x="450" y="684" text-anchor="middle" font-family="Archivo, Helvetica, sans-serif" font-size="36" font-weight="700" letter-spacing="1.5" fill="#ffffff">POLISH</text>
    <text x="450" y="735" text-anchor="middle" font-family="Archivo, Helvetica, sans-serif" font-size="22" font-weight="500" fill="#ffffff" opacity="0.85">Enzyme Mask</text>
    <text x="450" y="775" text-anchor="middle" font-family="Archivo, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#ffffff" opacity="0.65">75 ML / 2.5 FL OZ</text>  </g>
</svg>
