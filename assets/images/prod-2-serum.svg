<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200">
  <defs>
    <!-- Studio Cyclorama Background -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ececee"/>
      <stop offset="68%" stop-color="#e5e6e8"/>
      <stop offset="74%" stop-color="#dcdde0"/>
      <stop offset="100%" stop-color="#eaebed"/>
    </linearGradient>

    <!-- 3D Cylindrical Matte Shader -->
    <linearGradient id="cylBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c83c00"/>
      <stop offset="14%" stop-color="#fe5100"/>
      <stop offset="32%" stop-color="#ff7738"/>
      <stop offset="52%" stop-color="#fe5100"/>
      <stop offset="84%" stop-color="#c83c00"/>
      <stop offset="96%" stop-color="#fe5100"/>
      <stop offset="100%" stop-color="#c83c00"/>
    </linearGradient>

    <!-- 3D Cap Shader -->
    <linearGradient id="cylCap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#141619"/>
      <stop offset="28%" stop-color="#fe5100"/>
      <stop offset="65%" stop-color="#1a1c20"/>
      <stop offset="100%" stop-color="#0d0e10"/>
    </linearGradient>

    <linearGradient id="sameCap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c83c00"/>
      <stop offset="30%" stop-color="#ff7738"/>
      <stop offset="75%" stop-color="#c83c00"/>
      <stop offset="100%" stop-color="#c83c00"/>
    </linearGradient>

    <!-- Soft Floor Contact Shadow -->
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.34)"/>
      <stop offset="45%" stop-color="rgba(0,0,0,0.14)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>

    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="glossBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Studio Backdrop -->
  <rect width="900" height="1200" fill="url(#bgGrad)"/>  <ellipse cx="450" cy="1005" rx="195" ry="34" fill="url(#floorShadow)"/><g >    <!-- Pump / Actuator Nozzle -->
    <rect x="370" y="235" width="115" height="22" rx="6" fill="url(#sameCap)"/>
    <rect x="405" y="235" width="90" height="78" rx="10" fill="url(#sameCap)"/>
    <!-- Neck Collar -->
    <rect x="378" y="308" width="144" height="128" rx="8" fill="url(#sameCap)"/>
    <rect x="392" y="434" width="116" height="14" fill="#c83c00"/>
    <!-- Cylinder Main Body -->
    <rect x="315" y="446" width="270" height="555" rx="28" fill="url(#cylBody)"/>
    <!-- Specular Vertical Highlight -->
    <rect x="352" y="470" width="26" height="505" rx="13" fill="#ffffff" opacity="0.22" filter="url(#glossBlur)"/>
    <!-- Typography & Crest -->
    <text x="450" y="585" text-anchor="middle" font-family="Archivo, Helvetica, sans-serif" font-size="48" font-weight="700" letter-spacing="2.5" fill="#000000">SUPPLE</text>
    <circle cx="526" cy="735" r="20" fill="#ffcd01"/>
    <circle cx="526" cy="735" r="6" fill="#4190de"/>
    <text x="450" y="805" text-anchor="middle" font-family="Archivo, Helvetica, sans-serif" font-size="35" font-weight="700" letter-spacing="1.2" fill="#000000">PEPTIDE</text>
    <text x="450" y="846" text-anchor="middle" font-family="Archivo, Helvetica, sans-serif" font-size="35" font-weight="700" letter-spacing="1.2" fill="#000000">DEW</text>
    <text x="450" y="895" text-anchor="middle" font-family="Archivo, Helvetica, sans-serif" font-size="21" font-weight="500" fill="#000000" opacity="0.88">Plumping Serum</text>
    <text x="450" y="935" text-anchor="middle" font-family="Archivo, Helvetica, sans-serif" font-size="15" font-weight="500" fill="#000000" opacity="0.65">50 ML / 1.7 FL OZ</text>  </g>
</svg>
